name: OpenAI secret configuration check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify OpenAI secret exists without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in the production GitHub Environment."
            exit 1
          fi
          echo "OPENAI_API_KEY is configured."
